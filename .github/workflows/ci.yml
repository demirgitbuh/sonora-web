name: Website checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Translations, platform detection and release parsing
        run: npm test
      - name: Production build
        run: npm run build
      - name: Include license in distribution
        run: cp LICENSE dist/LICENSE.txt
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser, accessibility and responsive checks
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-website
          path: dist/
          retention-days: 14
